<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M&amp;M Candle Co. | شموع ومعطرات يدوية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5ee;--card:#fff;--ink:#2a1a17;--mut:#7a655f;--wine:#a63a50;--gold:#b98a3e;--line:#e8dccd;--tile:#f3e8da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f0d;--card:#221815;--ink:#f3e9df;--mut:#b9a79b;--wine:#b8465c;--gold:#d4aa63;--line:#3a2b26;--tile:#2d201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f0d;--card:#221815;--ink:#f3e9df;--mut:#b9a79b;--wine:#b8465c;--gold:#d4aa63;--line:#3a2b26;--tile:#2d201c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7}
.hero{background:radial-gradient(120% 90% at 50% 0%,#3a1c22 0%,#1a110e 60%,#2b2113 100%);color:#f3e9df;text-align:center;padding:40px 20px 48px}
.hero img{width:200px;max-width:60%;border-radius:20px}
.hero p{margin:20px 0 24px;color:#d9c3a0;font-size:1.15rem}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--wine);color:#fff;font:700 1.05rem "Cairo",Tahoma,sans-serif;padding:12px 34px;text-decoration:none;cursor:pointer}
.btn:focus-visible,input:focus-visible,.q button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
main{max-width:760px;margin:0 auto;padding:32px 16px 48px}
h2{font-size:1.5rem;margin:0 0 18px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;background:var(--tile);display:grid;place-items:center;font-size:3.4rem}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:1rem}
.info small{color:var(--mut);line-height:1.5}
.price{color:var(--gold);font-weight:700;margin-top:auto;padding-top:6px}
.add{margin:0 12px 12px;border:1.5px solid var(--wine);background:none;color:var(--wine);border-radius:999px;font:700 .95rem "Cairo",Tahoma,sans-serif;padding:6px;cursor:pointer}
.add:focus-visible{outline:3px solid var(--gold)}
#order{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--tile);color:var(--ink);font-size:1.1rem;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding:12px 0}
label{display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:1rem "Cairo",Tahoma,sans-serif}
#send{display:block;text-align:center;margin-top:18px;background:#1f9d55}
.empty,.hint{color:var(--mut)}
footer{text-align:center;color:var(--mut);padding:0 16px 32px;font-size:.9rem}
</style>
</head>

var P = [
  {id:1,n:"شمعة عطرية كلاسيك",d:"شمعة بعطر هادئ، مصبوبة يدويًا",p:180,e:"🕯️"},
  {id:2,n:"معطر جو بالعيدان",d:"عيدان سوداء وغطاء ذهبي بعطر فاخر",p:250,img:IMG},
  {id:3,n:"بوكس هدية",d:"شمعة ومعطر في تغليف هدية",p:420,e:"🎁"},
  {id:4,n:"شمعة ديكور",d:"قطعة تزيّن ركنك وتضيء المكان",p:220,e:"✨"}
];
var cart = {};
function fmt(n){return n.toLocaleString("ar-EG")+" ج.م";}
function $(i){return document.getElementById(i);}
$("grid").innerHTML = P.map(function(x){
  var pic = x.img ? '<img src="'+x.img+'" alt="'+x.n+'">' : x.e;
  return '<article class="card"><div class="pic">'+pic+'</div><div class="info"><h3>'+x.n+'</h3><small>'+x.d+'</small><div class="price">'+fmt(x.p)+'</div></div><button class="add" data-id="'+x.id+'">أضف للطلب</button></article>';
}).join("");
function find(id){return P.filter(function(x){return x.id==id;})[0];}
function render(){
  var ids = Object.keys(cart), total = 0, lines = [];
  if(!ids.length){$("cart").innerHTML='<p class="empty">لسه ما اخترتش حاجة. أضف منتج من القائمة.</p>';}
  else{
    $("cart").innerHTML = ids.map(function(id){
      var x=find(id), q=cart[id]; total+=x.p*q; lines.push("- "+x.n+" × "+q+" = "+fmt(x.p*q));
      return '<div class="row"><span>'+x.n+'</span><span class="q"><button data-d="1" data-id="'+id+'" aria-label="زيادة">+</button><b>'+q+'</b><button data-d="-1" data-id="'+id+'" aria-label="نقص">−</button></span></div>';
    }).join("") + '<div class="total"><span>الإجمالي</span><span>'+fmt(total)+'</span></div>';
  }
  var nm=$("nm").value.trim(), ph=$("ph").value.trim(), ad=$("ad").value.trim();
  var ok = ids.length && nm && ph && ad;
  var msg = "طلب جديد من M&M Candle Co.\n"+lines.join("\n")+"\nالإجمالي: "+fmt(total)+"\nالاسم: "+nm+"\nالموبايل: "+ph+"\nالعنوان: "+ad;
  var a = $("send");
  a.href = ok ? "https://wa.me/"+WA+"?text="+encodeURIComponent(msg) : "#order";
  a.setAttribute("aria-disabled", ok ? "false" : "true");
}
document.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b || !b.dataset.id) return;
  var id = b.dataset.id;
  if(b.classList.contains("add")){cart[id]=(cart[id]||0)+1;}
  else{cart[id]+=Number(b.dataset.d); if(cart[id]<1) delete cart[id];}
  render();
});
["nm","ph","ad"].forEach(function(i){$(i).addEventListener("input",render);});
render();
</script>
